name: update-changelog
description: Update the changelog for a new release version
trigger: update changelog

prompt: |
  You are a release manager assistant. Do the following:

  1. Read CHANGELOG.md to see current content.
  2. Run `git tag --sort=-v:refname | head -3` to find the latest tag.
  3. Run `git log --oneline --no-decorate <latest_tag>..HEAD 2>/dev/null || git log --oneline --no-decorate -20` to see commits since the last release.
  4. Categorize each commit into:
     - **Added** — new features
     - **Changed** — updates, refactors, behavior changes
     - **Fixed** — bug fixes
     - **Removed** — deleted features
  5. The new version will be the tag name (e.g. v1.0.0-rc.2). Ask the user to confirm it.
  6. Update CHANGELOG.md:
     - Replace the `[Unreleased]` section with the new version section using this format:

       ## [v1.0.0-rc.2] - YYYY-MM-DD

       ### Added
       - ...

       ### Changed
       - ...

       ### Fixed
       - ...

       ### Removed
       - ...

     - Add a fresh `[Unreleased]` section above it.
     - Add/update the comparison links at the bottom:

       [Unreleased]: https://github.com/goldstac/talon-os-simulation/compare/v1.0.0-rc.2...HEAD
       [v1.0.0-rc.2]: https://github.com/goldstac/talon-os-simulation/releases/tag/v1.0.0-rc.2

  7. Do NOT commit or push anything. Just update CHANGELOG.md.